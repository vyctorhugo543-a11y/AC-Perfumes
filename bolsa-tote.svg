<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c261c"/>
      <stop offset="50%" stop-color="#241610"/>
      <stop offset="100%" stop-color="#150c07"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4dc"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6222"/>
    </linearGradient>
    <filter id="bagShd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Background neutral card -->
  <rect width="400" height="400" fill="#faf7f2" rx="16"/>
  <!-- Bag Body with Shadow -->
  <g filter="url(#bagShd)" transform="translate(200, 230)">
    <!-- Main Tote Body -->
    <path d="M -90,-40 L 90,-40 L 115,110 C 115,120 105,128 95,128 L -95,128 C -105,128 -115,120 -115,110 Z" fill="url(#bagGrad1)" stroke="#52392c" stroke-width="2"/>
    <!-- Top Rim -->
    <rect x="-92" y="-44" width="184" height="8" rx="4" fill="#52392c"/>
    <!-- Handles (Double arch) -->
    <path d="M -50,-42 C -50,-135 50,-135 50,-42" fill="none" stroke="url(#bagGrad1)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -50,-42 C -50,-135 50,-135 50,-42" fill="none" stroke="#52392c" stroke-width="2"/>
    <!-- Gold Hardware Studs -->
    <rect x="-56" y="-40" width="12" height="18" rx="3" fill="url(#goldAcc)"/>
    <rect x="44" y="-40" width="12" height="18" rx="3" fill="url(#goldAcc)"/>
    <!-- Center Gold Logo Tag / Lock -->
    <circle cx="0" cy="18" r="16" fill="url(#goldAcc)"/>
    <circle cx="0" cy="18" r="13" fill="#241610"/>
    <text x="0" y="22" font-family="'Playfair Display', serif" font-size="11" font-weight="700" fill="url(#goldAcc)" text-anchor="middle">AC</text>
  </g>
</svg>