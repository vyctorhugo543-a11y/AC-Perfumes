<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="creamLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5ede2"/>
      <stop offset="100%" stop-color="#e2d2be"/>
    </linearGradient>
    <linearGradient id="goldAcc6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6222"/>
    </linearGradient>
    <filter id="bagShd6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#faf7f2" rx="16"/>
  <g filter="url(#bagShd6)" transform="translate(200, 230)">
    <!-- Half-moon Shoulder Strap -->
    <path d="M -80,-10 C -80,-130 80,-130 80,-10" fill="none" stroke="url(#creamLeather)" stroke-width="12" stroke-linecap="round"/>
    <path d="M -80,-10 C -80,-130 80,-130 80,-10" fill="none" stroke="#d5c1a7" stroke-width="1.5"/>
    <!-- Bag Half Moon Body -->
    <path d="M -100,-10 C -100,85 100,85 100,-10 C 100,20 -100,20 -100,-10 Z" fill="url(#creamLeather)" stroke="#d5c1a7" stroke-width="2"/>
    <path d="M -100,-10 L 100,-10 L 90,80 C 70,115 -70,115 -90,80 Z" fill="url(#creamLeather)" stroke="#d5c1a7" stroke-width="1.8"/>
    <!-- Gold Buckle / Ring Connectors -->
    <circle cx="-80" cy="-8" r="8" fill="none" stroke="url(#goldAcc6)" stroke-width="3"/>
    <circle cx="80" cy="-8" r="8" fill="none" stroke="url(#goldAcc6)" stroke-width="3"/>
    <!-- Front Minimalist Gold Monogram -->
    <circle cx="0" cy="40" r="14" fill="url(#goldAcc6)"/>
    <circle cx="0" cy="40" r="11" fill="#ffffff"/>
    <text x="0" y="44" font-family="'Playfair Display', serif" font-size="9" font-weight="700" fill="url(#goldAcc6)" text-anchor="middle">AC</text>
  </g>
</svg>