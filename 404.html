<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>AC Perfumes | Redirecionando</title>
  <script>
    var pathSegments = window.location.pathname.split('/').filter(Boolean);
    var repoName = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
    window.location.replace(window.location.origin + repoName);
  </script>
</head>
<body style="background:#1f140e; color:#dfb974; text-align:center; padding:60px 20px; font-family:sans-serif;">
  <h2>Redirecionando para a loja AC Perfumes...</h2>
  <p><a href="./" style="color:#ffffff;">Clique aqui se não for redirecionado automaticamente.</a></p>
</body>
</html>
