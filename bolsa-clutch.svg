<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="clutchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="25%" stop-color="#f0d28d"/>
      <stop offset="60%" stop-color="#c99d49"/>
      <stop offset="85%" stop-color="#fae3b2"/>
      <stop offset="100%" stop-color="#8c6227"/>
    </linearGradient>
    <filter id="clutchShd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#faf7f2" rx="16"/>
  <g filter="url(#clutchShd)" transform="translate(200, 220)">
    <!-- Fine chain strap -->
    <path d="M -85,0 C -85,-140 85,-140 85,0" fill="none" stroke="url(#clutchGold)" stroke-width="3" stroke-dasharray="3 2"/>
    <!-- Hard Shell Box Body -->
    <rect x="-105" y="0" width="210" height="115" rx="12" fill="url(#clutchGold)" stroke="#9c722e" stroke-width="2"/>
    <!-- Geometric Metallic Facets -->
    <path d="M -105,0 L 0,55 L 105,0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <path d="M -105,115 L 0,55 L 105,115" fill="none" stroke="#7a5518" stroke-width="1.5" opacity="0.6"/>
    <!-- Top Crystal / Jewel Clasp -->
    <rect x="-18" y="-12" width="36" height="14" rx="4" fill="#ffffff" stroke="url(#clutchGold)" stroke-width="1.5"/>
    <circle cx="0" cy="-5" r="3" fill="url(#clutchGold)"/>
  </g>
</svg>