<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="blackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="goldChain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="50%" stop-color="#dfb974"/>
      <stop offset="100%" stop-color="#8a6222"/>
    </linearGradient>
    <filter id="bagShd3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#faf7f2" rx="16"/>
  <g filter="url(#bagShd3)" transform="translate(200, 235)">
    <!-- Gold Chain Handle (Double Loop) -->
    <path d="M -80,-15 C -80,-155 80,-155 80,-15" fill="none" stroke="url(#goldChain)" stroke-width="6" stroke-dasharray="5 3"/>
    <!-- Bag Rect -->
    <rect x="-110" y="-15" width="220" height="135" rx="14" fill="url(#blackGrad)" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- Matelasse Quilted Pattern -->
    <g stroke="#383838" stroke-width="1.2" opacity="0.75">
      <line x1="-105" y1="20" x2="35" y2="-15"/>
      <line x1="-105" y1="65" x2="80" y2="-15"/>
      <line x1="-70" y1="120" x2="105" y2="20"/>
      <line x1="-25" y1="120" x2="105" y2="65"/>
      <line x1="105" y1="20" x2="-35" y2="-15"/>
      <line x1="105" y1="65" x2="-80" y2="-15"/>
      <line x1="70" y1="120" x2="-105" y2="20"/>
      <line x1="25" y1="120" x2="-105" y2="65"/>
    </g>
    <!-- Flap bottom curve -->
    <path d="M -110,65 L 110,65" stroke="#484848" stroke-width="2"/>
    <!-- Gold Lock -->
    <circle cx="0" cy="65" r="15" fill="url(#goldChain)"/>
    <circle cx="0" cy="65" r="11" fill="#141414"/>
    <text x="0" y="69" font-family="'Playfair Display', serif" font-size="10" font-weight="700" fill="url(#goldChain)" text-anchor="middle">AC</text>
  </g>
</svg>